<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found · Prashant Ghimire</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!-- This page carries its own styles on purpose. A 404 is served at whatever
     path was asked for, so a linked stylesheet would have to be either
     root-absolute (wrong under a subpath) or relative (wrong at depth). System
     fonts and no requests: it cannot render unstyled. -->
<style>
  :root { --paper: #faf9f6; --ink: #17191d; --soft: #3d434e; --muted: #5a616e; --rule: #cfc8ba; --accent: #0d6b5c; }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #0f1114; --ink: #e9e7e2; --soft: #c8cbd2; --muted: #9aa2ad; --rule: #39404a; --accent: #63d5b6; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
         font: 400 1rem/1.65 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 36rem; margin: 0 auto; padding: 5.5rem 1.35rem 4rem; }
  .eyebrow { font-family: ui-monospace, Consolas, monospace; font-size: 0.78rem; color: var(--muted); margin: 0 0 1.1rem; }
  h1 { font-family: Iowan Old Style, Palatino, Georgia, serif; font-weight: 500;
       font-size: clamp(1.9rem, 6vw, 2.5rem); line-height: 1.15; letter-spacing: -0.015em; margin: 0 0 1rem; }
  p { color: var(--soft); font-family: Iowan Old Style, Palatino, Georgia, serif; font-size: 1.1rem; margin: 0 0 1.8rem; }
  a { color: var(--accent); text-underline-offset: 3px; }
  .btn { display: inline-block; font-family: ui-monospace, Consolas, monospace; font-size: 0.78rem;
         text-decoration: none; padding: 0.5rem 0.95rem; border-radius: 999px;
         background: var(--accent); color: var(--paper); }
</style>
</head>
<body>
<main class="wrap">
  <p class="eyebrow">404</p>
  <h1>This page is not here</h1>
  <p>The link may be old, or I may have moved something without leaving a redirect behind.</p>
  <a class="btn" href="/">Back to the one page there is</a>
</main>
</body>
</html>
